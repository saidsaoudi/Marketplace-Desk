<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">MP</div>
    <div>
      <h3 class="title">Marketplace Desk</h3>
      <span style="font-size:10px; color:#64748b;">Auto-Publisher v1.0</span>
    </div>
  </div>

  <div class="status">
    <div class="dot"></div>
    <span>Extension Active & Ready</span>
  </div>

  <a href="http://localhost:3000" target="_blank" class="btn">
    Ouvrir Marketplace Desk
  </a>

  <a href="https://www.facebook.com/marketplace/you/selling" target="_blank" class="btn btn-secondary">
    Vos annonces Facebook
  </a>

  <p style="font-size:10px; color:#64748b; text-align:center; margin-top:10px;">
    Connecté automatiquement avec votre tableau de bord.
  </p>
</body>
</html>
